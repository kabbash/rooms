# Manual data operations on the dev database. Never runs on its own.
#
#   Actions → "Dev database" → Run workflow
#     seed  — re-run prisma/seed.ts (upserts the proposal's rooms; other data is kept)
#     reset — DROP everything, re-apply all migrations, then seed. Type "dev" to confirm.
name: Dev database

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [seed, reset]
        default: seed
      confirm:
        description: 'For "reset" only: type dev to confirm wiping all dev data'
        required: false
        type: string

concurrency:
  group: deploy-dev # never run while a deploy is migrating the same database
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  run:
    name: ${{ inputs.action }} dev database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - name: Check confirmation
        if: inputs.action == 'reset' && inputs.confirm != 'dev'
        run: |
          echo "::error::Reset wipes all dev data. Re-run and type dev in the confirm box."
          exit 1

      # Use the code that is currently deployed on dev, so migrations and seed match it.
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Check out the commit running on dev
        run: |
          sha="$(gcloud run services describe rooms-dev --region "${{ vars.GCP_REGION }}" --format='value(metadata.labels.commit)' 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            git fetch --depth=1 origin "$sha" && git checkout --quiet "$sha"
            echo "Using deployed commit \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rooms-dev not deployed yet, using ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fetch direct database URL
        run: |
          url="$(gcloud secrets versions access latest --secret=rooms-dev-database-url-direct)"
          echo "::add-mask::${url}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Reset (drop all data, re-apply migrations)
        if: inputs.action == 'reset'
        run: pnpm exec prisma migrate reset --force

      - name: Seed
        run: pnpm db:seed

      - run: echo "✅ dev database ${{ inputs.action }} done" >> "$GITHUB_STEP_SUMMARY"
